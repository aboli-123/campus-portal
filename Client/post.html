<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Item - Campus Lost &amp; Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Lost &amp; Found</a>
      <div id="navLinks" class="d-flex align-items-center"></div>
    </div>
  </nav>

  <div class="container" style="max-width: 600px">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3">Post a lost or found item</h4>
      <form id="postForm">
        <select id="type" class="form-select mb-2" required>
          <option value="">Lost or found?</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
        <input id="title" class="form-control mb-2" placeholder="Title (e.g. Black wallet)" required />
        <input id="category" class="form-control mb-2" placeholder="Category (e.g. Wallet, ID card)" />
        <input id="location" class="form-control mb-2" placeholder="Where? (e.g. Canteen)" />
        <input id="date" type="date" class="form-control mb-2" />
        <textarea id="description" class="form-control mb-2" rows="3" placeholder="Description"></textarea>
        <label class="form-label">Photo (optional, max 5 MB)</label>
        <input id="image" type="file" accept="image/*" class="form-control mb-3" />
        <button id="submitBtn" class="btn btn-primary w-100">Post item</button>
        <p id="msg" class="text-danger mt-2 mb-0"></p>
      </form>
    </div></div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    document.getElementById("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submitBtn");
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Posting...";

      const form = new FormData();
      form.append("type", document.getElementById("type").value);
      form.append("title", document.getElementById("title").value);
      form.append("category", document.getElementById("category").value);
      form.append("location", document.getElementById("location").value);
      form.append("date", document.getElementById("date").value);
      form.append("description", document.getElementById("description").value);
      const file = document.getElementById("image").files[0];
      if (file) form.append("image", file);

      try {
        const res = await fetch(`${API}/items`, {
          method: "POST",
          headers: { Authorization: `Bearer ${getToken()}` },
          body: form,
        });
        const data = await res.json();
        if (res.status === 401) return logout();
        if (!res.ok) throw new Error(data.message || "Could not post item");
        window.location.href = "index.html";
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Post item";
      }
    });
  </script>
</body>
</html>
