<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Lost &amp; Found</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
 <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Campus Lost &amp; Found</a>
    <div id="navLinks" class="d-flex align-items-center"></div>
  </div>
</nav>

  <div class="container">
    <div class="row g-2 mb-4">
      <div class="col-md-6">
        <input id="search" class="form-control" placeholder="Search items..." />
      </div>
      <div class="col-md-3">
        <select id="type" class="form-select">
          <option value="">All</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
      </div>
      <div class="col-md-3">
        <button id="searchBtn" class="btn btn-primary w-100">Search</button>
      </div>
    </div>

    <div id="items" class="row g-3"></div>
  </div>

  <script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
