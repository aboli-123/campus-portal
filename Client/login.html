<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Campus Lost &amp; Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Lost &amp; Found</a>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm"><div class="card-body">
          <h4 class="mb-3">Login</h4>
          <form id="loginForm">
            <input id="loginEmail" type="email" class="form-control mb-2" placeholder="Email" required />
            <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password" required />
            <button class="btn btn-primary w-100">Login</button>
            <p id="loginMsg" class="text-danger mt-2 mb-0"></p>
          </form>
        </div></div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm"><div class="card-body">
          <h4 class="mb-3">Register</h4>
          <form id="registerForm">
            <input id="regName" class="form-control mb-2" placeholder="Full name" required />
            <input id="regEmail" type="email" class="form-control mb-2" placeholder="Email" required />
            <input id="regDept" class="form-control mb-2" placeholder="Department (e.g. ECS)" />
            <input id="regPassword" type="password" class="form-control mb-3" placeholder="Password" required />
            <button class="btn btn-success w-100">Create account</button>
            <p id="regMsg" class="text-danger mt-2 mb-0"></p>
          </form>
        </div></div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    async function send(path, body) {
      const res = await fetch(`${API}/auth/${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Something went wrong");
      return data;
    }

    function saveLogin(data) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "index.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        const data = await send("login", {
          email: document.getElementById("loginEmail").value,
          password: document.getElementById("loginPassword").value,
        });
        saveLogin(data);
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("regMsg");
      msg.textContent = "";
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      try {
        await send("register", {
          name: document.getElementById("regName").value,
          email,
          password,
          department: document.getElementById("regDept").value,
        });
        saveLogin(await send("login", { email, password }));
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
